<div
  class="relative mx-auto min-h-screen flex flex-col gap-10 overflow-hidden bg-white px-4 py-15 lg:items-center lg:justify-center lg:gap-[56px]"
>
  <!-- decorative corner shape -->
  <app-brand-paw-blob
    color="#FFCA62"
    class="absolute h-[145.05px] w-[139.53px] rotate-285 top-[-63px] right-[-25px] lg:w-[244.16px] lg:h-[253.11px] lg:top-[49px] lg:right-[-43px]"
  />
  <app-brand-quarter
    color="#75D0FC"
    class="hidden lg:block lg:absolute lg:h-[117.5px] lg:w-[117.5px] lg:rotate-45 lg:bottom-[220px] lg:left-[32px]"
  />
  <app-brand-star
    class="hidden lg:block lg:absolute lg:h-[310px] lg:w-[318px] lg:rotate-88 lg:bottom-[-97px] lg:left-[-70px]"
  />

  <!-- headline -->
  <div class="relative w-full max-w-[440px] flex flex-col items-center gap-2 text-center">
    <h1 class="text-h2 lg:text-h1">Welcome back!</h1>
    <p class="text-body-1 text-gray-400 lg:text-h3">Find your perfect pet sitter with us</p>
  </div>

  <!-- form -->
  <div class="relative w-full max-w-[440px] flex flex-col gap-8">
    <label class="flex flex-col gap-1">
      <span class="text-body-2 text-black">Email</span>
      <input
        type="email"
        placeholder="Enter your email"
        class="w-full h-12 pl-3 pr-4 text-body-2 outline-none rounded-lg border border-gray-200  placeholder:text-gray-400 focus:border-orange-500"
      />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-body-2 text-black">Password</span>
      <input
        type="password"
        placeholder="Enter your password"
        class="w-full h-12 pl-3 pr-4 text-body-2 outline-none rounded-lg border border-gray-200  placeholder:text-gray-400 focus:border-orange-500"
      />
    </label>

    <app-button variant="primary" [fullWidth]="true">Login</app-button>

    <!-- supporting inputs -->
    <div class="flex flex-row items-center justify-between">
      <app-checkbox>Remember?</app-checkbox>
      <app-button variant="ghost" size="sm">Forget Password?</app-button>
    </div>

    <!-- divider -->
    <div class="flex items-center gap-3">
      <span class="h-px flex-1 bg-gray-200"></span>
      <span class="text-body-1 text-gray-400">Or continue with</span>
      <span class="h-px flex-1 bg-gray-200"></span>
    </div>

    <!-- social -->
    <div class="flex gap-3">
      <app-button variant="social" [fullWidth]="true">
        <app-icon-facebook />
        Facebook
      </app-button>

      <app-button variant="social" [fullWidth]="true">
        <app-icon-google />
        Google
      </app-button>
    </div>

    <!-- bottom -->
    <div class="flex items-center justify-center gap-2">
      <span class="text-body-1">Don’t have any account?</span>
      <a routerLink="/register" class="text-body-1 text-orange-500 hover:text-orange-400 active:text-orange-600">Register</a>
    </div>
  </div>
</div>
